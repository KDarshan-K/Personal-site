{% extends "base.html" %}
{% block title %}Contact — {{ site.title }}{% endblock %}
{% block content %}
<section class="page-intro">
  <p class="eyebrow">{{ site.title }} / CONTACT</p>
  <h1>Say hello<span class="period">.</span></h1>
  <p class="lead">For engineering conversations, collaboration, research, or just to exchange ideas.</p>
  <p><a class="text-link" href="mailto:{{ site.email }}">{{ site.email }} ↗</a></p>
  <div class="social-links"><a href="{{ site.links.github }}">GitHub ↗</a><a href="{{ site.links.linkedin }}">LinkedIn ↗</a></div>
</section>
{% endblock %}
